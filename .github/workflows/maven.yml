name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/novatech?allowLoadLocalInfile=true
      DB_USER: root
      DB_PASSWORD: root

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Iniciar MySQL
        run: |
          docker run -d \
            --name mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=novatech \
            -p 3306:3306 \
            mysql:8.0 \
            --local-infile=1

      - name: Esperar MySQL
        run: |
          until docker exec mysql mysqladmin ping -proot --silent; do
            sleep 2
          done

      - name: Verificar local_infile
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "SHOW VARIABLES LIKE 'local_infile';"

      - name: Inicializar base de datos
        run: |
          mysql --local-infile=1 -h127.0.0.1 -uroot -proot novatech < sql/tablas.sql
          mysql --local-infile=1 -h127.0.0.1 -uroot -proot novatech < sql/constraints.sql
          mysql --local-infile=1 -h127.0.0.1 -uroot -proot novatech < sql/logica_bd.sql
          mysql --local-infile=1 -h127.0.0.1 -uroot -proot novatech < sql/importacion.sql

      - name: Build and Test
        working-directory: java
        run: mvn -B clean verify