name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/novatech?allowLoadLocalInfile=true
      DB_USER: root
      DB_PASSWORD: root

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Iniciar MySQL
        run: |
            docker run -d \
            --name mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_ROOT_HOST=% \
            -e MYSQL_DATABASE=novatech \
            -p 3306:3306 \
            mysql:8.0 \
            --local-infile=1

      - name: Mostrar logs
        if: always()
        run: |
            sleep 20
            docker logs mysql

      - name: Esperar MySQL
        run: |
            echo "Esperando MySQL..."

            for i in {1..60}; do
            if docker exec mysql mysqladmin ping -uroot -proot --silent; then
                echo "MySQL listo"
                break
            fi

            sleep 2
            done

            docker logs mysql

      - name: Verificar local_infile
        run: |
            docker exec mysql mysql -uroot -proot -e "SHOW VARIABLES LIKE 'local_infile';"

      - name: Inicializar base de datos
        run: |
            docker exec -i mysql mysql -uroot -proot novatech < sql/tablas.sql
            docker exec -i mysql mysql -uroot -proot novatech < sql/constraints.sql
            docker exec -i mysql mysql -uroot -proot novatech < sql/logica_bd.sql
            docker exec -i mysql mysql --local-infile=1 -uroot -proot novatech < sql/importacion.sql

      - name: Build and Test
        working-directory: java
        run: mvn -B clean verify